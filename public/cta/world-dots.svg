<svg width="1200" height="600" viewBox="0 0 1200 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="600" fill="transparent"/>

  <!-- Dotted world map pattern - simplified continents -->
  <defs>
    <pattern id="dotPattern" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="1.5" fill="#3a3a3a"/>
    </pattern>
  </defs>

  <!-- North America -->
  <ellipse cx="280" cy="180" rx="160" ry="100" fill="url(#dotPattern)"/>
  <ellipse cx="180" cy="220" rx="80" ry="60" fill="url(#dotPattern)"/>

  <!-- South America -->
  <ellipse cx="320" cy="420" rx="70" ry="110" fill="url(#dotPattern)"/>

  <!-- Europe -->
  <ellipse cx="580" cy="160" rx="100" ry="50" fill="url(#dotPattern)"/>
  <ellipse cx="640" cy="180" rx="60" ry="40" fill="url(#dotPattern)"/>

  <!-- Africa -->
  <ellipse cx="600" cy="320" rx="90" ry="130" fill="url(#dotPattern)"/>

  <!-- Asia -->
  <ellipse cx="800" cy="180" rx="180" ry="100" fill="url(#dotPattern)"/>
  <ellipse cx="920" cy="280" rx="100" ry="80" fill="url(#dotPattern)"/>

  <!-- Australia -->
  <ellipse cx="980" cy="420" rx="80" ry="50" fill="url(#dotPattern)"/>
</svg>
